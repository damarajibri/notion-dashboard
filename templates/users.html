<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master User — EXO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d1a; --bg2: #111122; --surface: #161628; --surface2: #1c1c35;
  --border: #2a2a4a; --border-hover: #3d3d6b;
  --text: #e8e8f0; --text2: #8888aa;
  --accent: #7c6af7; --accent2: #5b4fd4; --purple: #a78bfa;
  --green: #22d4a0; --green-bg: rgba(34,212,160,.12);
  --red: #f05673; --red-bg: rgba(240,86,115,.12);
  --yellow: #f0b429; --yellow-bg: rgba(240,180,41,.12);
  --blue: #38bdf8; --blue-bg: rgba(56,189,248,.12);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --shadow-md: 0 4px 20px rgba(0,0,0,.4); --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
}
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
.header { background: linear-gradient(135deg, var(--surface), var(--surface2)); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-md); position: sticky; top: 0; z-index: 50; }
.header-inner { max-width: 1100px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo { width: 42px; height: 42px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.brand-title { font-size: 16px; font-weight: 700; }
.brand-title span { color: var(--accent); }
.brand-sub { font-size: 12px; color: var(--text2); }
.header-actions { display: flex; gap: 10px; align-items: center; }
.whoami { font-size: 12px; color: var(--text2); }
.whoami b { color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; font-size: 13px; font-weight: 600; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; transition: all .2s; font-family: inherit; }
.btn:hover { border-color: var(--border-hover); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; }
.btn-primary:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-danger { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.main { max-width: 1100px; margin: 0 auto; padding: 28px; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 800; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
th { background: var(--surface2); color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge-root { background: var(--red-bg); color: var(--red); }
.badge-admin { background: var(--blue-bg); color: var(--blue); }
.badge-user { background: var(--surface2); color: var(--text2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot-on { background: var(--green); } .dot-off { background: var(--text2); }
.row-actions { display: flex; gap: 6px; }
/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { width: 100%; max-width: 420px; background: linear-gradient(135deg, var(--surface), var(--surface2)); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 26px; }
.modal h2 { font-size: 18px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
input, select { width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
.hint { font-size: 11px; color: var(--text2); margin-top: 4px; }
.check-row { display: flex; align-items: center; gap: 8px; }
.check-row input { width: auto; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); z-index: 200; opacity: 0; transform: translateY(10px); transition: all .25s; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast-ok { background: var(--green-bg); border: 1px solid var(--green); color: var(--green); }
.toast-err { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }
@keyframes uspin { to { transform: rotate(360deg); } }
/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--text2); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: inherit; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
/* Activity filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
.filters .field { margin-bottom: 0; }
.filters .field.small { min-width: 150px; }
.filters label { margin-bottom: 4px; }
.filters input, .filters select { padding: 8px 10px; font-size: 13px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); }
.pager .info { font-size: 12px; color: var(--text2); }
.pager .controls { display: flex; gap: 8px; align-items: center; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; }
.act-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface2); color: var(--text2); }
.act-view { background: var(--blue-bg); color: var(--blue); }
.act-login { background: var(--green-bg); color: var(--green); }
.act-failed { background: var(--red-bg); color: var(--red); }
.act-mut { background: var(--yellow-bg); color: var(--yellow); }
.detail-cell { max-width: 280px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; padding: 30px; color: var(--text2); }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">🌕</div>
      <div>
        <div class="brand-title">EXO <span>Dashboard</span></div>
        <div class="brand-sub">Master User</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="whoami">👤 <b>{{ user.username if user else '-' }}</b> · {{ user.role if user else '' }}</span>
      <a class="btn btn-ghost" href="{{ url_for('index') }}">← Dashboard</a>
      <a class="btn btn-ghost" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>
</header>

<div class="main">
  <div class="tabs">
    <button class="tab active" id="tabUsersBtn" onclick="switchTab('users')">👥 Users</button>
    <button class="tab" id="tabActivityBtn" onclick="switchTab('activity')">📜 Log Aktivitas</button>
  </div>

  <!-- Panel: Users -->
  <div class="tab-panel active" id="panel-users">
    <div class="page-head">
      <div class="page-title">👥 Master User</div>
      <button class="btn btn-primary" onclick="openAdd()">➕ Tambah User</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Username</th><th>Nama Lengkap</th>
            <th>Role</th><th>Status</th><th>Dibuat</th><th>Last Login</th><th style="text-align:right">Aksi</th>
          </tr>
        </thead>
        <tbody id="userTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Panel: Activity Log -->
  <div class="tab-panel" id="panel-activity">
    <div class="page-head">
      <div class="page-title">📜 Log Aktivitas</div>
      <button class="btn" onclick="loadActivity(1)">🔄 Muat Ulang</button>
    </div>

    <div class="filters">
      <div class="field small">
        <label for="af_user">User</label>
        <select id="af_user"><option value="">— Semua —</option></select>
      </div>
      <div class="field small">
        <label for="af_action">Aksi</label>
        <select id="af_action"><option value="">— Semua —</option></select>
      </div>
      <div class="field small">
        <label for="af_from">Dari tanggal</label>
        <input type="date" id="af_from">
      </div>
      <div class="field small">
        <label for="af_to">Sampai tanggal</label>
        <input type="date" id="af_to">
      </div>
      <button class="btn btn-primary" onclick="loadActivity(1)">Terapkan</button>
      <button class="btn btn-ghost" onclick="resetActivityFilters()">Reset</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Waktu</th><th>User</th><th>Aksi</th><th>Target</th><th>Detail</th><th>IP</th>
          </tr>
        </thead>
        <tbody id="activityTbody"></tbody>
      </table>
      <div class="pager">
        <div class="info" id="actInfo">—</div>
        <div class="controls">
          <button class="btn btn-sm" id="actPrev" onclick="actPage(-1)">← Sebelumnya</button>
          <span class="info" id="actPageLabel">1</span>
          <button class="btn btn-sm" id="actNext" onclick="actPage(1)">Berikutnya →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Add/Edit -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Tambah User</h2>
    <input type="hidden" id="userId">
    <div class="field">
      <label for="f_username">Username</label>
      <input type="text" id="f_username" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="f_fullname">Nama Lengkap</label>
      <input type="text" id="f_fullname" autocomplete="off">
    </div>
    <div class="field">
      <label for="f_password">Password</label>
      <input type="password" id="f_password" autocomplete="new-password">
      <div class="hint" id="pwHint">Wajib diisi untuk user baru.</div>
    </div>
    <div class="field">
      <label for="f_role">Role</label>
      <select id="f_role">
        <option value="user">user</option>
        <option value="admin">admin</option>
      </select>
    </div>
    <div class="field check-row">
      <input type="checkbox" id="f_active" checked>
      <label for="f_active" style="margin:0">Aktif</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveUser()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ROOT_USERNAME = "exo";
const CURRENT_ROLE = "{{ user.role if user else '' }}";

function toast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'toast-ok' : 'toast-err');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

// Overlay loading saat simpan/hapus user.
function showProcessing(msg = 'Memproses...') {
  let ov = document.getElementById('processingOverlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'processingOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center';
    ov.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 30px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg)"><div style="width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:uspin .7s linear infinite"></div><div id="processingMsg" style="font-size:14px;font-weight:600;color:var(--text)"></div></div>';
    document.body.appendChild(ov);
  }
  document.getElementById('processingMsg').textContent = msg;
  ov.style.display = 'flex';
}
function hideProcessing() {
  const ov = document.getElementById('processingOverlay');
  if (ov) ov.style.display = 'none';
}

function badge(role) {
  const cls = role === 'root' ? 'badge-root' : (role === 'admin' ? 'badge-admin' : 'badge-user');
  return `<span class="badge ${cls}">${role}</span>`;
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtLastLogin(iso) {
  if (!iso) return '<span style="color:var(--text2)">Belum pernah</span>';
  // Stored as UTC ISO (e.g. 2026-09-30T14:47:00Z). Render in local time.
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('id-ID', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

async function loadUsers() {
  const res = await fetch('/api/users');
  const data = await res.json();
  const tb = document.getElementById('userTbody');
  tb.innerHTML = '';
  if (!data.ok) { toast(data.error || 'Gagal memuat user', false); return; }
  for (const u of data.users) {
    const isRoot = u.username === ROOT_USERNAME;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.id}</td>
      <td><b>${esc(u.username)}</b></td>
      <td>${esc(u.full_name) || '<span style="color:var(--text2)">—</span>'}</td>
      <td>${badge(u.role)}</td>
      <td><span class="dot ${u.is_active ? 'dot-on' : 'dot-off'}"></span>${u.is_active ? 'Aktif' : 'Nonaktif'}</td>
      <td style="color:var(--text2)">${(u.created_at||'').slice(0,10)}</td>
      <td style="color:var(--text2)">${fmtLastLogin(u.last_login)}</td>
      <td>
        <div class="row-actions" style="justify-content:flex-end">
          <button class="btn btn-sm" onclick='openEdit(${JSON.stringify(u)})'>✏️ Edit</button>
          ${isRoot ? '' : `<button class="btn btn-sm btn-danger" onclick="delUser(${u.id}, '${esc(u.username)}')">🗑️</button>`}
        </div>
      </td>`;
    tb.appendChild(tr);
  }
}

function openAdd() {
  document.getElementById('modalTitle').textContent = 'Tambah User';
  document.getElementById('userId').value = '';
  document.getElementById('f_username').value = '';
  document.getElementById('f_username').disabled = false;
  document.getElementById('f_fullname').value = '';
  document.getElementById('f_password').value = '';
  document.getElementById('pwHint').textContent = 'Wajib diisi untuk user baru.';
  document.getElementById('f_role').value = 'user';
  document.getElementById('f_active').checked = true;
  document.getElementById('modal').classList.add('open');
}

function openEdit(u) {
  document.getElementById('modalTitle').textContent = 'Edit User';
  document.getElementById('userId').value = u.id;
  document.getElementById('f_username').value = u.username;
  document.getElementById('f_username').disabled = true; // username tidak diubah
  document.getElementById('f_fullname').value = u.full_name || '';
  document.getElementById('f_password').value = '';
  document.getElementById('pwHint').textContent = 'Kosongkan jika tidak ingin mengubah password.';
  const roleSel = document.getElementById('f_role');
  const isRoot = u.username === ROOT_USERNAME;
  // Root role tidak bisa diubah; tampilkan opsi root & disable select.
  roleSel.innerHTML = isRoot
    ? '<option value="root">root</option>'
    : '<option value="user">user</option><option value="admin">admin</option>';
  roleSel.value = u.role;
  roleSel.disabled = isRoot;
  const active = document.getElementById('f_active');
  active.checked = !!u.is_active;
  active.disabled = isRoot; // root tidak bisa dinonaktifkan
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveUser() {
  const id = document.getElementById('userId').value;
  const body = {
    full_name: document.getElementById('f_fullname').value,
    role: document.getElementById('f_role').value,
    is_active: document.getElementById('f_active').checked,
  };
  const pw = document.getElementById('f_password').value;
  if (pw) body.password = pw;

  let url, method;
  if (id) {
    url = '/api/users/' + id; method = 'PUT';
  } else {
    url = '/api/users'; method = 'POST';
    body.username = document.getElementById('f_username').value.trim();
    if (!body.username) { toast('Username wajib diisi', false); return; }
    if (!pw) { toast('Password wajib diisi untuk user baru', false); return; }
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  showProcessing(id ? 'Menyimpan user...' : 'Membuat user...');
  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      toast('Tersimpan ✓');
      closeModal();
      loadUsers();
    } else {
      toast(data.error || 'Gagal menyimpan', false);
    }
  } catch (e) {
    toast('Kesalahan jaringan', false);
  } finally {
    hideProcessing();
    btn.disabled = false;
  }
}

async function delUser(id, username) {
  if (!confirm(`Hapus user "${username}"? Tindakan ini tidak dapat dibatalkan.`)) return;
  showProcessing('Menghapus user...');
  try {
    const res = await fetch('/api/users/' + id, { method: 'DELETE' });
    const data = await res.json();
    if (data.ok) { toast('User dihapus ✓'); loadUsers(); }
    else { toast(data.error || 'Gagal menghapus', false); }
  } catch (e) {
    toast('Kesalahan jaringan', false);
  } finally {
    hideProcessing();
  }
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

// ─── Tabs ──────────────────────────────────────────────────────────────────
let activityLoaded = false;
function switchTab(name) {
  const isUsers = name === 'users';
  document.getElementById('panel-users').classList.toggle('active', isUsers);
  document.getElementById('panel-activity').classList.toggle('active', !isUsers);
  document.getElementById('tabUsersBtn').classList.toggle('active', isUsers);
  document.getElementById('tabActivityBtn').classList.toggle('active', !isUsers);
  if (!isUsers && !activityLoaded) { activityLoaded = true; loadActivity(1); }
}

// ─── Activity log ────────────────────────────────────────────────────────────
let actState = { page: 1, pages: 1, pageSize: 50 };

function actBadgeClass(action) {
  if (action === 'view') return 'act-view';
  if (action === 'auth.login') return 'act-login';
  if (action.endsWith('login_failed')) return 'act-failed';
  if (action.startsWith('user.') || action.startsWith('api.')) return 'act-mut';
  return '';
}

function fmtTs(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('id-ID', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
}

function fmtDetail(detail) {
  if (!detail) return '';
  // detail is a JSON string from the server; show it compactly.
  try {
    const obj = JSON.parse(detail);
    return Object.entries(obj)
      .map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`)
      .join(', ');
  } catch (e) {
    return String(detail);
  }
}

function buildActivityQuery(page) {
  const p = new URLSearchParams();
  p.set('page', page);
  p.set('page_size', actState.pageSize);
  const u = document.getElementById('af_user').value;
  const a = document.getElementById('af_action').value;
  const from = document.getElementById('af_from').value;
  const to = document.getElementById('af_to').value;
  if (u) p.set('user_id', u);
  if (a) p.set('action', a);
  // Dates are local calendar days; server compares against UTC ISO strings.
  if (from) p.set('from', from + 'T00:00:00Z');
  if (to) p.set('to', to + 'T23:59:59Z');
  return p.toString();
}

async function loadActivity(page) {
  page = page || 1;
  const tb = document.getElementById('activityTbody');
  tb.innerHTML = '<tr><td colspan="6" class="empty">Memuat…</td></tr>';
  let data;
  try {
    const res = await fetch('/api/activity?' + buildActivityQuery(page));
    data = await res.json();
  } catch (e) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Kesalahan jaringan</td></tr>';
    return;
  }
  if (!data.ok) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">${esc(data.error || 'Gagal memuat log')}</td></tr>`;
    return;
  }

  // Populate filter dropdowns once (users + actions) on first load.
  const userSel = document.getElementById('af_user');
  if (userSel.options.length <= 1 && Array.isArray(data.users)) {
    for (const u of data.users) {
      const o = document.createElement('option');
      o.value = u.id; o.textContent = u.username;
      userSel.appendChild(o);
    }
  }
  const actionSel = document.getElementById('af_action');
  if (actionSel.options.length <= 1 && Array.isArray(data.actions)) {
    for (const a of data.actions) {
      const o = document.createElement('option');
      o.value = a; o.textContent = a;
      actionSel.appendChild(o);
    }
  }

  actState.page = data.page;
  actState.pages = data.pages || 1;

  tb.innerHTML = '';
  if (!data.items.length) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Tidak ada aktivitas.</td></tr>';
  } else {
    for (const r of data.items) {
      const tr = document.createElement('tr');
      const detailStr = fmtDetail(r.detail);
      tr.innerHTML = `
        <td class="mono">${fmtTs(r.ts)}</td>
        <td>${r.username ? '<b>' + esc(r.username) + '</b>' : '<span style="color:var(--text2)">anonim</span>'}</td>
        <td><span class="act-badge ${actBadgeClass(r.action)}">${esc(r.action)}</span></td>
        <td class="mono">${esc(r.target) || '—'}</td>
        <td class="detail-cell" title="${esc(detailStr)}">${esc(detailStr) || '—'}</td>
        <td class="mono" style="color:var(--text2)">${esc(r.ip) || '—'}</td>`;
      tb.appendChild(tr);
    }
  }

  document.getElementById('actInfo').textContent =
    `Total ${data.total} aktivitas · halaman ${data.page} dari ${actState.pages}`;
  document.getElementById('actPageLabel').textContent = data.page;
  document.getElementById('actPrev').disabled = data.page <= 1;
  document.getElementById('actNext').disabled = data.page >= actState.pages;
}

function actPage(delta) {
  const next = actState.page + delta;
  if (next < 1 || next > actState.pages) return;
  loadActivity(next);
}

function resetActivityFilters() {
  document.getElementById('af_user').value = '';
  document.getElementById('af_action').value = '';
  document.getElementById('af_from').value = '';
  document.getElementById('af_to').value = '';
  loadActivity(1);
}

loadUsers();
</script>
</body>
</html>
