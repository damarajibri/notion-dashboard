<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EXO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d1a; --surface: #161628; --surface2: #1c1c35;
  --border: #2a2a4a; --border-hover: #3d3d6b;
  --text: #e8e8f0; --text2: #8888aa;
  --accent: #7c6af7; --accent2: #5b4fd4; --purple: #a78bfa;
  --red: #f05673; --red-bg: rgba(240, 86, 115, 0.12);
  --green: #22d4a0;
  --radius-md: 12px; --radius-lg: 16px;
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(1200px 600px at 50% -10%, #1a1a3a 0%, var(--bg) 55%);
  color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; font-size: 14px;
}
.login-card {
  width: 100%; max-width: 400px;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 36px 32px;
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.brand-logo {
  width: 46px; height: 46px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.brand-title { font-size: 18px; font-weight: 700; }
.brand-title span { color: var(--accent); }
.brand-sub { font-size: 12px; color: var(--text2); }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--text2); font-size: 13px; margin-bottom: 22px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
input[type=text], input[type=password] {
  width: 100%; padding: 11px 13px; font-size: 14px; color: var(--text);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-md); font-family: inherit; transition: border .2s;
}
input:focus { outline: none; border-color: var(--accent); }
.captcha-row { display: flex; gap: 10px; align-items: stretch; }
.captcha-box {
  flex: 0 0 auto; min-width: 130px; padding: 8px 14px;
  display: flex; align-items: center; justify-content: center; gap: 3px;
  background: repeating-linear-gradient(45deg, #20203c, #20203c 6px, #191932 6px, #191932 12px);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  user-select: none;
}
.captcha-box span {
  font-family: 'Courier New', monospace; font-weight: 800; font-size: 22px;
  color: var(--text); letter-spacing: 2px;
  text-shadow: 1px 1px 0 rgba(124,106,247,.5);
}
.captcha-box span:nth-child(2n) { transform: rotate(-8deg) translateY(-1px); color: var(--purple); }
.captcha-box span:nth-child(3n) { transform: rotate(7deg) translateY(2px); color: var(--green); }
.captcha-refresh {
  flex: 0 0 auto; width: 42px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text2); border-radius: var(--radius-md);
  cursor: pointer; font-size: 16px; transition: all .2s;
}
.captcha-refresh:hover { color: var(--text); border-color: var(--border-hover); }
.captcha-input { flex: 1; }
.btn-submit {
  width: 100%; margin-top: 8px; padding: 12px; font-size: 14px; font-weight: 700;
  color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: var(--radius-md); cursor: pointer; transition: opacity .2s;
}
.btn-submit:hover { opacity: .9; }
.alert {
  background: var(--red-bg); border: 1px solid var(--red); color: var(--red);
  padding: 10px 12px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 18px;
}
.foot { margin-top: 20px; text-align: center; font-size: 12px; color: var(--text2); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">🌕</div>
      <div>
        <div class="brand-title">EXO <span>Dashboard</span></div>
        <div class="brand-sub">Projects & Tasks · Notion API</div>
      </div>
    </div>

    <h1>Masuk</h1>
    <p class="subtitle">Silakan login untuk mengakses dashboard.</p>

    {% if error %}
      <div class="alert">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="field">
        <label for="captcha">Captcha</label>
        <div class="captcha-row">
          <div class="captcha-box" id="captchaBox" title="Ketik ulang kode ini">
            {% for ch in captcha %}<span>{{ ch }}</span>{% endfor %}
          </div>
          <button type="button" class="captcha-refresh" id="captchaRefresh" title="Ganti captcha">🔄</button>
          <input class="captcha-input" type="text" id="captcha" name="captcha"
                 placeholder="Ketik kode" required autocomplete="off"
                 autocapitalize="characters" spellcheck="false">
        </div>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>

    <div class="foot">🔒 Sesi aman · Password terenkripsi (PBKDF2)</div>
  </div>

<script>
  // Reload captcha without reloading the page.
  document.getElementById('captchaRefresh').addEventListener('click', async () => {
    try {
      const res = await fetch('{{ url_for("captcha_refresh") }}');
      const data = await res.json();
      const box = document.getElementById('captchaBox');
      box.innerHTML = '';
      for (const ch of data.captcha) {
        const s = document.createElement('span');
        s.textContent = ch;
        box.appendChild(s);
      }
      document.getElementById('captcha').value = '';
      document.getElementById('captcha').focus();
    } catch (e) { /* ignore */ }
  });
</script>
</body>
</html>
